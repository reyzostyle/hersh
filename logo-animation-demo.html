<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hersh logo — bloom animation</title>
<style>
  :root {
    --app-bg: #0A0F1A;
    --tile-bg: #0d1b2e;
    --petal: #ffffff;
    --bloom-duration: 1.0s;
    --stagger: 0.1s;
    --spin: 24deg;
    --total: calc(var(--bloom-duration) + 4 * var(--stagger));
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--app-bg); color:#e6edf6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:32px; padding:40px;
  }
  .tile {
    width:240px; height:240px; border-radius:56px; background:var(--tile-bg);
    display:grid; place-items:center; box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .logo { width:80%; height:80%; overflow:visible; shape-rendering:geometricPrecision; }

  /* fade на всю ГРУППУ -> без блика */
  .flower { opacity:0; animation:gfade var(--total) ease-out forwards; }
  @keyframes gfade { from { opacity:0; } to { opacity:1; } }

  /* лепестки = секторы одного силуэта, делят центр и впадины -> складываются идеально */
  .petal {
    transform-box:view-box; transform-origin:50px 50px;
    fill:var(--petal);
    stroke:var(--petal); stroke-width:0.6; stroke-linejoin:round; stroke-linecap:round;
    animation:bloom var(--bloom-duration) cubic-bezier(.22,1,.36,1) backwards;
  }
  .petal.p1 { animation-delay:calc(0 * var(--stagger)); }
  .petal.p2 { animation-delay:calc(1 * var(--stagger)); }
  .petal.p3 { animation-delay:calc(2 * var(--stagger)); }
  .petal.p4 { animation-delay:calc(3 * var(--stagger)); }
  .petal.p5 { animation-delay:calc(4 * var(--stagger)); }
  @keyframes bloom {
    0%   { transform:rotate(calc(-1 * var(--spin))) scale(0); }
    100% { transform:rotate(0deg) scale(1); }
  }

  .controls { display:flex; gap:12px; align-items:center; }
  button {
    background:#1b2740; color:#e6edf6; border:1px solid #2a3a5c;
    padding:10px 18px; border-radius:10px; font-size:14px; cursor:pointer; transition:background .15s;
  }
  button:hover { background:#243352; }
  .hint { font-size:13px; color:#8b9bb4; max-width:440px; text-align:center; line-height:1.5; }
  code { background:#11203a; padding:1px 5px; border-radius:4px; }
</style>
</head>

  <div class="controls"><button id="replay">↻ Повторить</button></div>
  <p class="hint">Лепестки = секторы одного силуэта, складываются идеально в логотип. Скорость/спин — в <code>:root</code>.</p>
<script>
  const btn=document.getElementById('replay');
  const animated=document.querySelectorAll('.flower, .petal');
  btn.addEventListener('click',()=>{
    animated.forEach(el=>el.style.animation='none');
    void document.body.getBoundingClientRect();
    animated.forEach(el=>el.style.animation='');
  });
</script>
