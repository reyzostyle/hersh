<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chumoku</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup">
  <header class="head">
    <img src="icons/icon-32.png" width="20" height="20" alt="" />
    <span class="brand">Chumoku</span>
    <span class="head-tag mono">Shorts workflow</span>
  </header>

  <!-- On a Short: the two actions for it. -->
  <section id="on-video" class="rise" hidden>
    <p class="eyebrow"><span class="dot"></span>This Short</p>
    <h1 class="title">Analyze it <span class="dim">or steal it.</span></h1>
    <p id="video-id" class="mono faint"></p>
    <div class="rows">
      <button class="row" data-action="analyze">
        <span class="row-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M8 12.5l2-2.5 2 1.5 2-3"/></svg></span>
        <span class="row-body"><span class="row-title">Analyze</span><span class="row-sub">Why it worked, out of 100</span></span>
        <span class="row-meta">5 cr</span>
      </button>
      <button class="row row-primary" data-action="steal">
        <span class="row-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/><path d="M14 11.5v5M11.5 14h5"/></svg></span>
        <span class="row-body"><span class="row-title">Steal</span><span class="row-sub">Its format, rebuilt for you</span></span>
        <span class="row-meta">5 cr</span>
      </button>
    </div>
  </section>

  <!-- Anywhere else: paste a link. -->
  <section id="off-video" class="rise" hidden>
    <p class="eyebrow"><span class="dot"></span>Paste a Short</p>
    <h1 class="title">Drop a link. <span class="dim">Or open any Short.</span></h1>
    <div class="field">
      <input id="link" type="text" placeholder="Paste a Shorts link" autocomplete="off" spellcheck="false" />
    </div>
    <p id="link-error" class="error" hidden>That doesn't look like a YouTube link.</p>
    <div class="pair">
      <button class="btn" data-action="analyze">Analyze</button>
      <button class="btn btn-primary" data-action="steal">Steal</button>
    </div>
  </section>

  <footer class="foot">
    <a href="https://chumoku.co/?utm_source=extension" target="_blank" rel="noopener">Open Chumoku ↗</a>
    <span class="mono faint">Alt+Shift+A / S</span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
