<!doctype html><html><head><meta charset="utf-8"><title>marquee</title><link rel="stylesheet" href="store.css">
<style>
  html, body { width: 1400px; height: 560px; }
  .mq { position: relative; width: 1400px; height: 560px; overflow: hidden; display: grid; grid-template-columns: 620px 1fr; align-items: center; padding: 0 96px;
    background: radial-gradient(90% 120% at 80% 50%, #19191c 0%, #0A0A0B 60%); }
  .mq .row { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 26px; margin-bottom: 40px; }
  .mq .row img { width: 42px; height: 42px; border-radius: 10px; }
  .mq h2 { font-size: 64px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.04; }
  .mq .pills { margin-top: 40px; }
  .fan { position: relative; height: 560px; }
  .fan .c { position: absolute; top: 50%; left: 50%; width: 208px; aspect-ratio: 4 / 5; border-radius: 22px; overflow: hidden; background: #000;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,255,255,0.08); }
  .fan .c img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fan .c span { position: absolute; left: 12px; bottom: 12px; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; line-height: 1;
    padding: 7px 12px; border-radius: 999px; background: rgba(0,0,0,0.62); color: #fff; }
</style></head><body><div class="mq">
<div>
  <div class="row"><img src="../icons/icon-128.png" alt="">Chumoku</div>
  <h2>Steal what<br>already works.</h2>
  <div class="pills"><span class="pill primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/><path d="M14 11.5v5M11.5 14h5"/></svg>Steal</span><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4 19.5l1.3-4.6A7.5 7.5 0 1 1 20 11.5z"/></svg>Ask</span></div>
</div>
<div class="fan">
  <div class="c" style="transform: translate(-50%,-50%) translateX(-190px) rotate(-10deg)"><img src="../../public/landing/EocsE3pFnAI.webp" alt=""><span>17×</span></div>
  <div class="c" style="transform: translate(-50%,-50%) translateX(190px) rotate(10deg)"><img src="../../public/landing/nGPFYc6eTKw.webp" alt=""><span>11×</span></div>
  <div class="c" style="transform: translate(-50%,-50%) translateX(-95px) translateY(-8px) rotate(-4deg)"><img src="../../public/landing/Y1s03EY3UCk.webp" alt=""><span>31×</span></div>
  <div class="c" style="transform: translate(-50%,-50%) translateX(95px) translateY(-8px) rotate(4deg)"><img src="../../public/landing/0JZtdAtJiyk.webp" alt=""><span>110×</span></div>
  <div class="c" style="transform: translate(-50%,-50%) translateY(-18px) scale(1.06)"><img src="../../public/landing/3iUo7bnsN30.webp" alt=""><span>65×</span></div>
</div>
</div></body></html>
