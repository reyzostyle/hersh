<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chumoku</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0A0A0B; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- The real app at chumoku.co/panel. Chrome treats a frame on a host the
       extension has permission for as first-party, so the site's session
       works here without a separate login. -->

  <script type="module" src="panel.js"></script>
</body>
</html>
