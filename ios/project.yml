name: Chumoku
options:
  bundleIdPrefix: co.chumoku
  deploymentTarget:
    iOS: "26.0" # on-device long-form transcription (SpeechTranscriber)
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  Chumoku:
    type: application
    platform: iOS
    sources:
      - path: Chumoku
        excludes:
          - "Fonts/OFL.txt"
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.chumoku.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        CODE_SIGN_STYLE: Automatic
        # Ivan's free Personal Team; swap for the paid team when there is one.
        # A Personal Team cannot sign Sign in with Apple, so device builds need
        # the paid team from here on (simulator builds still work).
        DEVELOPMENT_TEAM: 7M6YY6SQ7L
        CODE_SIGN_ENTITLEMENTS: Chumoku/Chumoku.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      # Purchases in the simulator run against this file instead of the App
      # Store (Xcode → Product → Run). Its transactions are signed by Xcode,
      # so apple-iap refuses them unless APPLE_IAP_ALLOW_XCODE=1 is set.
      storeKitConfiguration: Chumoku.storekit
    info:
      path: Chumoku/Info.plist
      properties:
        CFBundleDisplayName: Chumoku
        UILaunchScreen:
          UIColorName: Background
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Chumoku films your takes.
        NSMicrophoneUsageDescription: Chumoku records your voice with each take.
        NSSpeechRecognitionUsageDescription: Chumoku listens to your takes on this iPhone to cut them.
        NSPhotoLibraryAddUsageDescription: Chumoku saves your takes and finished videos to Photos.
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
        CFBundleURLTypes:
          - CFBundleURLName: co.chumoku.app
            CFBundleURLSchemes: [chumoku]
