    <!-- Microsoft Clarity. Loads once here rather than from a component: this
         is a single-page app, so the tag survives every client-side route
         change and Clarity picks those up from the History API itself.

         Gated to the live domain by an allowlist rather than a localhost
         blocklist, so Vercel preview deploys (*.vercel.app) and any local
         prod build stay out of the recordings too, not just localhost.
         Nothing to configure at deploy time: an env var would silently
         break analytics the day someone forgets to set it in Vercel, and
         the project id is public in the bundle either way. -->
    <script type="text/javascript">
      (function () {
        var host = window.location.hostname;
        if (host !== "hershymedia.com" && host !== "www.hershymedia.com") return;

        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y3s9udspxe");
      })();
    </script>

    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What does Hershy actually do?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It reads short-form video. Send it a link, a hook or a script and it watches or reads the thing and tells you what to change, then you keep talking to it until you know what to do. Connect your channel and it checks that against your real retention curve instead of guessing. Shorts only. That is the whole point."

      "@type": "Question",
      "name": "What happens when I connect my YouTube?",

        "@type": "Answer",
        "text": "You get your own numbers instead of an opinion. Hershy reads what YouTube Studio shows you, finds the exact seconds viewers left, and writes every fix against those timestamps. It takes two clicks, and everything else works without connecting anything."

    },

      "@type": "Question",
      "name": "What is in it?",
      "acceptedAnswer": {

      "@type": "Question",
      "name": "Can I start for free?",
      "acceptedAnswer": {
        "@type": "Answer",

      "@type": "Question",

      }
    },

      }
    }

  <body>
    <div id="root"></div>
    <script>
      // The public routes are prerendered into #root so crawlers can read them
      // without running JavaScript (see src/prerender.tsx). A signed-in visitor
      // would otherwise get a flash of the landing page on every open, before
      // React resolves their session and swaps in the app. If a Supabase
      // session is on this device, clear the placeholder immediately: they are
      // going to the dashboard, not the pitch.
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') > 0) {
            document.getElementById('root').innerHTML = '';
            break;
          }
        }
      } catch (e) { /* private mode, storage blocked: keep the placeholder */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
