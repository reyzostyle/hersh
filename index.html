    <!-- Microsoft Clarity. Loads once here rather than from a component: this
         is a single-page app, so the tag survives every client-side route
         change and Clarity picks those up from the History API itself.

         Gated to the live domain by an allowlist rather than a localhost
         blocklist, so Vercel preview deploys (*.vercel.app) and any local
         prod build stay out of the recordings too, not just localhost.
         Nothing to configure at deploy time: an env var would silently
         break analytics the day someone forgets to set it in Vercel, and
         the project id is public in the bundle either way. -->
    <script type="text/javascript">
      (function () {
        var host = window.location.hostname;
        // The old domain is still listed while it redirects here, so the
        // session recording does not go dark for anyone who arrives on a link
        // from before the rename. Drop it once nothing points at it.
        var live = ["chumoku.co", "www.chumoku.co", "hershymedia.com", "www.hershymedia.com"];
        if (live.indexOf(host) === -1) return;

        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y3s9udspxe");
      })();
    </script>

    <!-- Structured data. This is what answer engines and search results read
         directly, without running any JavaScript - and since this app renders
         its whole page client-side, for a crawler that doesn't execute JS this
         is the ONLY description of the product it ever sees. Keep the prices
         in sync with UpgradePage.tsx and the questions with the faqs array in
         LandingPage.tsx; stale structured data is worse than none.

         It is a @graph rather than a lone SoftwareApplication because the
         problem this has to solve is not "describe the app", it is WHICH
         CHUMOKU. Searching the name returns a Japanese timber company, which
         has decades of footprint behind it while this name had no declared
         entity at all - just a product description with nothing owning it.
         So there is an Organization with a stable @id, the site and the app
         both point at it as their publisher, and the three read as one thing
         instead of three loose descriptions.

         sameAs is the strongest signal here, and every entry has to be a
         profile that genuinely exists and genuinely belongs to this brand -
         pointing it at a handle nobody owns hands the graph a claim that
         resolves to a stranger. All three below were checked: each is named
         Chumoku, and the Instagram and TikTok profiles link back to
         chumoku.co, which is the reciprocity that makes the pairing hold.

  <body>
    <div id="root"></div>
    <script>
      // The public routes are prerendered into #root so crawlers can read them
      // without running JavaScript (see src/prerender.tsx). A signed-in visitor
      // would otherwise get a flash of the landing page on every open, before
      // React resolves their session and swaps in the app. If a Supabase
      // session is on this device, clear the placeholder immediately: they are
      // going to the dashboard, not the pitch.
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') > 0) {
            document.getElementById('root').innerHTML = '';
            break;
          }
        }
      } catch (e) { /* private mode, storage blocked: keep the placeholder */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
